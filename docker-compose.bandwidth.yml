# Optional overlay for live bandwidth and connection-limit controls.
# Use together with your normal docker-compose.yml / docker-compose.override.yml
# after installing and starting the host-side controller.
services:
  monitor:
    environment:
      BANDWIDTH_CONTROL_ENABLED: "true"
      BANDWIDTH_CONTROL_SOCKET: /run/ravencoin-bandwidth/control.sock
    volumes:
      - /run/ravencoin-bandwidth:/run/ravencoin-bandwidth:ro
