name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Syntax check (all Python files, stdlib only)
        run: python -m py_compile app/*.py contrib/*.py
      - name: Static error check (undefined names, syntax errors)
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.12.9"
          ruff check --select E9,F app contrib
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check app/static/network-traffic.js
          node --check app/static/connection-control.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run test suite (mocked Ravencoin Core, no live node required)
        run: python -m unittest discover -t . -s tests -p "test_*.py" -v

  demo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate Vercel demo JavaScript and config
        run: |
          node --check api/demo-data.js
          node --check api/demo-history.js
          node --check demo/app.js
          python -m json.tool vercel.json >/dev/null
      - name: Ensure public demo is complete and unambiguously labelled
        run: |
          grep -q "PUBLIC DEMO" demo/index.html
          grep -q "SIMULATED" demo/index.html
          grep -q "NODE REQUIRED" demo/index.html
          grep -q ">History <" demo/index.html
          grep -q ">Mempool <" demo/index.html
          grep -q "Mempool transactions" demo/index.html
          grep -q "history-canvas" demo/index.html
          grep -q "brand-icon" demo/index.html
          grep -q "not connected to a private Ravencoin Core or ElectrumX" api/demo-data.js
          grep -q "data-api.binance.vision" api/demo-data.js
          grep -q "data-api.binance.vision" api/demo-history.js
      - name: Validate embedded Ravencoin PNG icon
        run: |
          python - <<'PY'
          import base64
          import pathlib
          import re

          html = pathlib.Path("demo/index.html").read_text(encoding="utf-8")
          match = re.search(r'class="brand-icon"[^>]+src="data:image/png;base64,([^"]+)"', html)
          assert match, "brand icon data URI missing"
          raw = base64.b64decode(match.group(1), validate=True)
          assert raw.startswith(b"\x89PNG\r\n\x1a\n"), "brand icon is not a valid PNG"
          assert len(raw) > 1000, "brand icon PNG unexpectedly small"
          PY

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t ravencoin-node-monitor:ci .
      - name: Smoke test (starts, serves the dashboard page)
        run: |
          docker run -d --name ci-smoketest -p 18899:8899 \
            -e CORE_RPC_HOST=127.0.0.1 -e CORE_RPC_PORT=1 -e ELECTRUMX_ENABLED=false \
            ravencoin-node-monitor:ci
          sleep 3
          curl -sf -o /dev/null http://127.0.0.1:18899/
          curl -sf -o /dev/null http://127.0.0.1:18899/api/status
          curl -sf -o /dev/null http://127.0.0.1:18899/healthz
          curl -sf -o /dev/null http://127.0.0.1:18899/metrics
          curl -sf -o /dev/null http://127.0.0.1:18899/static/network-traffic.js
          curl -sf -o /dev/null http://127.0.0.1:18899/static/connection-control.js
          docker logs ci-smoketest
          docker rm -f ci-smoketest
