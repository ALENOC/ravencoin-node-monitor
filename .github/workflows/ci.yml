name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only needs to read repository contents. Keep the automatic GITHUB_TOKEN
# read-only even if repository defaults become more permissive later.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Syntax check (all Python files, stdlib only)
        run: python -m py_compile app/*.py contrib/*.py
      - name: Static error check (undefined names, syntax errors)
        run: |
          python -m pip install --disable-pip-version-check "ruff==0.12.9"
          ruff check --select E9,F app contrib

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run test suite (mocked Ravencoin Core, no live node required)
        run: python -m unittest discover -t . -s tests -p "test_*.py" -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t ravencoin-node-monitor:ci .
      - name: Smoke test (starts, serves the dashboard page)
        run: |
          docker run -d --name ci-smoketest -p 18899:8899 \
            -e CORE_RPC_HOST=127.0.0.1 -e CORE_RPC_PORT=1 -e ELECTRUMX_ENABLED=false \
            ravencoin-node-monitor:ci
          sleep 3
          curl -sf -o /dev/null http://127.0.0.1:18899/
          curl -sf -o /dev/null http://127.0.0.1:18899/api/status
          curl -sf -o /dev/null http://127.0.0.1:18899/healthz
          curl -sf -o /dev/null http://127.0.0.1:18899/metrics
          docker logs ci-smoketest
          docker rm -f ci-smoketest
